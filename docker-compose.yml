version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: quantix-mysql
    environment:
      MYSQL_ROOT_PASSWORD: QuantixRoot123!
      MYSQL_DATABASE: QuantixDb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quantix-api
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=QuantixDb;User=root;Password=QuantixRoot123!;
      - Jwt__SecurityKey=QuantixSuperSecretKey2024!@#$$%^&*()_+ABCDEF1234567890LONG
      - Jwt__Issuer=QuantixAPI
      - Jwt__Audience=QuantixClient
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
